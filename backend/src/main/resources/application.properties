quarkus.application.name=telefonbuch-backend

quarkus.http.port=8080

# Database (H2 in-memory for local dev)
quarkus.datasource.db-kind=h2
quarkus.datasource.username=sa
quarkus.datasource.password=
quarkus.datasource.jdbc.url=jdbc:h2:mem:telefonbuch;DB_CLOSE_DELAY=-1
quarkus.hibernate-orm.database.generation=update

# OpenAPI
quarkus.smallrye-openapi.path=/q/openapi

# OIDC / Entra ID
quarkus.oidc.tenant-enabled=default
quarkus.oidc.default.auth-server-url=https://login.microsoftonline.com/${ENTRA_ID_TENANT:common}/v2.0
quarkus.oidc.default.issuer=https://login.microsoftonline.com/${ENTRA_ID_TENANT:common}/v2.0
quarkus.oidc.default.client-id=${ENTRA_ID_CLIENT_ID:REPLACE_WITH_ENTRA_ID_CLIENT_ID}
quarkus.oidc.default.tenant=${ENTRA_ID_TENANT:common}
quarkus.oidc.default.roles.source=accesstoken
quarkus.oidc.authentication.cookie-path=/
quarkus.oidc.authentication.cookie-same-site=lax

# Security: /api/* requires authentication.
# Setzen Sie TELEFONBUCH_AUTH_PATHS auf einen leeren Wert, um den Zugriff
# fuer Vorschauen / lokale Tests zu ermoeglichen.
quarkus.http.auth.permission.authenticated.paths=${TELEFONBUCH_AUTH_PATHS:/api/*}
quarkus.http.auth.permission.authenticated.policy=authenticated

# Demo-Modus: Schreibt Beispiel-Kontakte in eine leere Datenbank und
# entschaefft den Zugriffsschutz (TELEFONBUCH_AUTH_PATHS="").
quarkus.telefonbuch.demo-mode=${DEMO_MODE:false}